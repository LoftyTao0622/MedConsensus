services:
  app:
    image: ${APP_IMAGE:-crpi-4wwu4n7c8aebuv9g.cn-hangzhou.personal.cr.aliyuncs.com/lofty/medconsensus:dev}
    container_name: medconsensus-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8086}:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/medconsenus
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}

      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: 5432
      PGVECTOR_USER: ${POSTGRES_USER:-postgres}
      PGVECTOR_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      PGVECTOR_DATABASE: medconsenus

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-12345678}

      API_KEY: ${API_KEY:?set API_KEY in .env}
      MIMO_API_KEY: ${MIMO_API_KEY:-}

      LANGSMITH_ENABLED: ${LANGSMITH_ENABLED:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-MedConsenus}
      LANGSMITH_SERVICE_NAME: ${LANGSMITH_SERVICE_NAME:-medconsenus-backend}
      LANGSMITH_CAPTURE_CONTENT: ${LANGSMITH_CAPTURE_CONTENT:-false}
      LANGSMITH_OTEL_ENDPOINT: ${LANGSMITH_OTEL_ENDPOINT:-https://api.smith.langchain.com/otel/v1/traces}

      JAVA_OPTS: ${JAVA_OPTS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  nginx:
    image: m.daocloud.io/docker.io/library/nginx:1.27-alpine
    container_name: medconsensus-nginx
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - /opt/medconsensus/frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/medconsensus.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started

  postgres:
    image: m.daocloud.io/docker.io/pgvector/pgvector:pg16
    container_name: medconsensus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medconsenus
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d medconsenus"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: m.daocloud.io/docker.io/library/redis:7-alpine
    container_name: medconsensus-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: m.daocloud.io/docker.io/library/neo4j:5-community
    container_name: medconsensus-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-12345678}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-12345678}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD:-12345678}\" 'RETURN 1;'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
